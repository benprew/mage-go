<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="pip-shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <radialGradient id="grad-w"><stop offset="0%" stop-color="#f8f4e0"/><stop offset="100%" stop-color="#d4c8a0"/></radialGradient>
    <radialGradient id="grad-u"><stop offset="0%" stop-color="#6aa8d4"/><stop offset="100%" stop-color="#2a5a8a"/></radialGradient>
    <radialGradient id="grad-b"><stop offset="0%" stop-color="#4a4a52"/><stop offset="100%" stop-color="#1a1a20"/></radialGradient>
    <radialGradient id="grad-r"><stop offset="0%" stop-color="#c84a30"/><stop offset="100%" stop-color="#7a2010"/></radialGradient>
    <radialGradient id="grad-g"><stop offset="0%" stop-color="#4a8a3a"/><stop offset="100%" stop-color="#1a4a10"/></radialGradient>
  </defs>

  <!-- outer arcane circle -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#2a2520" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(201,168,76,0.12)" stroke-width="0.5"/>

  <!-- inner arcane circle -->
  <circle cx="100" cy="100" r="38" fill="none" stroke="#2a2520" stroke-width="1"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="rgba(201,168,76,0.08)" stroke-width="0.5"/>

  <!-- pentagon edges -->
  <polygon
    points="100,25 171.3,71.7 144.1,146.3 55.9,146.3 28.7,71.7"
    fill="none" stroke="#2a2520" stroke-width="1.2"/>

  <!-- inner pentagram star -->
  <polygon
    points="100,25 144.1,146.3 28.7,71.7 171.3,71.7 55.9,146.3"
    fill="none" stroke="rgba(201,168,76,0.18)" stroke-width="0.8" filter="url(#glow)"/>

  <!-- spokes -->
  <line x1="100" y1="100" x2="100" y2="25" stroke="#1a1a20" stroke-width="0.5"/>
  <line x1="100" y1="100" x2="171.3" y2="71.7" stroke="#1a1a20" stroke-width="0.5"/>
  <line x1="100" y1="100" x2="144.1" y2="146.3" stroke="#1a1a20" stroke-width="0.5"/>
  <line x1="100" y1="100" x2="55.9" y2="146.3" stroke="#1a1a20" stroke-width="0.5"/>
  <line x1="100" y1="100" x2="28.7" y2="71.7" stroke="#1a1a20" stroke-width="0.5"/>

  <!-- tick marks -->
  <line x1="100" y1="8" x2="100" y2="15" stroke="#3a3020" stroke-width="1"/>
  <line x1="179" y1="65" x2="173" y2="69" stroke="#3a3020" stroke-width="1"/>
  <line x1="150" y1="155" x2="146" y2="149" stroke="#3a3020" stroke-width="1"/>
  <line x1="50" y1="155" x2="54" y2="149" stroke="#3a3020" stroke-width="1"/>
  <line x1="21" y1="65" x2="27" y2="69" stroke="#3a3020" stroke-width="1"/>

  <!-- center dot -->
  <circle cx="100" cy="100" r="3" fill="#c9a84c" opacity="0.3"/>
  <circle cx="100" cy="100" r="1.5" fill="#c9a84c" opacity="0.6"/>

  <!-- White (top) -->
  <circle cx="100" cy="25" r="12" fill="url(#grad-w)" stroke="#3a3020" stroke-width="1.5" filter="url(#pip-shadow)"/>
  <text x="100" y="29" text-anchor="middle" font-family="'Cinzel',Georgia,serif" font-size="11" font-weight="700" fill="#3a3020">W</text>

  <!-- Blue (upper-right) -->
  <circle cx="171.3" cy="71.7" r="12" fill="url(#grad-u)" stroke="#1a3a5a" stroke-width="1.5" filter="url(#pip-shadow)"/>
  <text x="171.3" y="75.7" text-anchor="middle" font-family="'Cinzel',Georgia,serif" font-size="11" font-weight="700" fill="#e0eaf4">U</text>

  <!-- Black (lower-right) -->
  <circle cx="144.1" cy="146.3" r="12" fill="url(#grad-b)" stroke="#2a2a30" stroke-width="1.5" filter="url(#pip-shadow)"/>
  <text x="144.1" y="150.3" text-anchor="middle" font-family="'Cinzel',Georgia,serif" font-size="11" font-weight="700" fill="#a0a0a8">B</text>

  <!-- Red (lower-left) -->
  <circle cx="55.9" cy="146.3" r="12" fill="url(#grad-r)" stroke="#4a1008" stroke-width="1.5" filter="url(#pip-shadow)"/>
  <text x="55.9" y="150.3" text-anchor="middle" font-family="'Cinzel',Georgia,serif" font-size="11" font-weight="700" fill="#f4d0c0">R</text>

  <!-- Green (upper-left) -->
  <circle cx="28.7" cy="71.7" r="12" fill="url(#grad-g)" stroke="#0a2a08" stroke-width="1.5" filter="url(#pip-shadow)"/>
  <text x="28.7" y="75.7" text-anchor="middle" font-family="'Cinzel',Georgia,serif" font-size="11" font-weight="700" fill="#d0e8c0">G</text>
</svg>
