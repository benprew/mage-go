[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mage-go"
version = "0.1.0"
description = "Python bindings for the mage-go MTG rules engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cffi>=2.0.0",
    "orjson>=3.9",
]

[tool.setuptools]
package-dir = {"" = "cmd/pylib"}

[tool.setuptools.packages.find]
where = ["cmd/pylib"]
include = ["mage*"]

[tool.setuptools.package-data]
mage = ["libmage.*"]
