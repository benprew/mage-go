version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    gocritic:
      disabled-checks:
        - ifElseChain
        - hugeParam
        - rangeValCopy
        - commentedOutCode
      enabled-tags:
        - diagnostic
        - performance
        - style

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration

    staticcheck:
      checks:
        - all
        - "-ST1000"
        - "-ST1003"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - data
      - web
      - docs
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unparam
          - gocritic
      - path: cards/
        linters:
          - unparam
      - path: pkg/mage/doc\.go
        linters:
          - misspell
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - git.sr.ht/~cdcarter/mage-go
  exclusions:
    generated: lax
    paths:
      - data
      - web
